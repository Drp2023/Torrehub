document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

  </script>

-smoothing: antialiased; }\n  a { color: #0056B3; text-decoration: none; }\n  a:hover { color: #C75B39; }\n<\u002Fstyle>\n<\u002Fhelmet>\n\n\n\n<div style=\"font-family:'Figtree',system-ui,sans-serif;color:#17203A;padding:0 0 160px;display:grid;gap:0;justify-items:start\">\n\n  <div style=\"width:1920px;padding:72px 80px 64px;background:#0E1526;color:#F7F7FB;display:grid;gap:40px\">\n    <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:40px\">\n      <div style=\"display:grid;gap:24px;max-width:880px\">\n        <div style=\"display:inline-flex;align-items:center;gap:10px;justify-self:start;padding:7px 14px;border-radius:100px;background:rgba(255,140,0,0.16)\">\n          <span style=\"width:7px;height:7px;border-radius:50%;background:#FF8C00;color:#17203A\"><\u002Fspan>\n          <span style=\"font-size:12px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#FFD09A\">Direction C<\u002Fspan>\n        <\u002Fdiv>\n        <h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:78px;line-height:0.98;letter-spacing:-0.04em;color:#FFFFFF\">Modern<br>Local Hub<\u002Fh1>\n        <p style=\"margin:0;font-size:19px;line-height:1.62;color:#A3AECB;text-wrap:pretty\">Torrehub's actual position, made visible: not a classifieds site with a directory bolted on, but one place that answers \"what's around me\". Discovery modules instead of endless grids, blue used as a surface rather than a link colour, soft 20px geometry and pill controls. Editorial and marketplace hold equal weight — a weekend guide sits beside a van for sale without either looking out of place.<\u002Fp>\n      <\u002Fdiv>\n      <div style=\"display:grid;gap:14px;justify-items:end\">\n        <img src=\"6776d7e3-782d-4a7e-bde2-b83f4fd7b059\" alt=\"Torrehub\" style=\"height:44px;width:auto;display:block;filter:brightness(0) invert(1)\">\n        <div style=\"font-size:11.5px;font-weight:600;letter-spacing:0.12em;text-transform:uppercase;color:#A3AECB;text-align:right;line-height:2\">Parity with A and B<br>Desktop 1440 · Mobile 390<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n    <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px\">\n      <div style=\"background:#17203A;border-radius:20px;padding:24px;display:grid;gap:10px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FFD09A\">Rationale<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.55;color:#D5DBEC\">Local discovery is the product. Every screen offers a next place to look, not just a result set.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17203A;border-radius:20px;padding:24px;display:grid;gap:10px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FFD09A\">Character<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.55;color:#D5DBEC\">Colour-blocked modules, 20px radii, pill controls, Space Grotesk display over Figtree.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17203A;border-radius:20px;padding:24px;display:grid;gap:10px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FFD09A\">Mobile thesis<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.55;color:#D5DBEC\">A feed of modules you swipe through. Location is the first control, not a filter buried in a sheet.<\u002Fdiv>\n      <\u002Fdiv>\n      <div style=\"background:#17203A;border-radius:20px;padding:24px;display:grid;gap:10px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FFD09A\">Implementation<\u002Fdiv>\n        <div style=\"font-size:15px;line-height:1.55;color:#D5DBEC\">Flat colour fills and border-radius do all the work. Two webfonts, no gradients, no blur.<\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n  <div style=\"width:1920px;padding:64px 80px;background:#F7F7FB;display:grid;gap:48px\">\n    <div style=\"display:flex;align-items:baseline;gap:16px\">\n      <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;color:#5F6A8A\">F-01 / F-02<\u002Fspan>\n      <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:34px;font-weight:700;letter-spacing:-0.03em\">Colour, type, spacing, depth<\u002Fh2>\n    <\u002Fdiv>\n\n    <div style=\"display:grid;grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:44px;align-items:start\">\n      <div style=\"display:grid;gap:26px\">\n        <div style=\"display:grid;gap:12px\">\n          <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">Brand as surface<\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px\">\n            <div style=\"display:grid;gap:8px\"><div style=\"height:82px;border-radius:16px;background:#0056B3\"><\u002Fdiv><div style=\"font-size:13px;font-weight:700\">Primary surface<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6A8A\">#0056B3<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;gap:8px\"><div style=\"height:82px;border-radius:16px;background:#003D82\"><\u002Fdiv><div style=\"font-size:13px;font-weight:700\">Deep blue<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6A8A\">#003D82<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;gap:8px\"><div style=\"height:82px;border-radius:16px;background:#FF8C00;color:#17203A\"><\u002Fdiv><div style=\"font-size:13px;font-weight:700\">Accent CTA<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6A8A\">#FF8C00<\u002Fdiv><\u002Fdiv>\n            <div style=\"display:grid;gap:8px\"><div style=\"height:82px;border-radius:16px;background:#A8482B\"><\u002Fdiv><div style=\"font-size:13px;font-weight:700\">Clay secondary<\u002Fdiv><div style=\"font-size:11.5px;color:#5F6A8A\">#C75B39<\u002 ackground:#FFF1E0;border-radius:20px;padding:20px 24px\">\n              <p style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;line-height:1.4;letter-spacing:-0.02em;color:#8A5309\">The photocopy is the one people forget. There is no copier in the building, and the nearest shop closes at two.<\u002Fp>\n            <\u002Fdiv>\n            <p style=\"margin:0;font-size:16px;line-height:1.72;color:#3A4562\">Bring proof of why you need the number, too — a signed rental contract, a property reservation, an employment offer. Arriving without it is the most common reason for a wasted slot.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:20px;display:grid;gap:14px;max-width:660px\">\n            <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">Mentioned in this guide<\u002Fspan>\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px\">\n              <div style=\"background:#E6EFFA;border-radius:16px;padding:16px;display:grid;gap:8px\">\n                <div style=\"width:36px;height:36px;border-radius:100px;background:#FFFFFF;display:grid;place-items:center\"><svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0056B3\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M14.5 3.5l6 6-2.5 2.5-2-2-8 8-4 1.5 1.5-4 8-8-2-2z\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n                <span style=\"font-size:14.5px;font-weight:700;color:#00458F\">Gestoría &amp; Tax Advisors<\u002Fspan>\n                <span style=\"font-size:12.5px;font-weight:700;color:#0056B3\">12 verified listings →<\u002Fspan>\n              <\u002Fdiv>\n              <div style=\"background:#EDEDF4;border-radius:16px;padding:16px;display:grid;gap:8px\">\n                <div style=\"width:36px;height:36px;border-radius:100px;backgr 1.55;color:#17203A\">12 verified advisors across Torrevieja and Orihuela Costa.<\u002Fspan>\n            <button style=\"font-family:inherit;font-size:14px;font-weight:700;color:#8A5309;background:#FFFFFF;border:none;border-radius:100px;height:46px;cursor:pointer\">Browse advisors<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n\n    <div style=\"width:1440px;background:#F7F7FB;border-radius:24px;overflow:hidden;border:1px solid #17203A\">\n      <div style=\"height:72px;padding:0 28px;display:flex;align-items:center;background:#FFFFFF;border-bottom:1px solid #E2E2EC\">\n        <img src=\"6776d7e3-782d-4a7e-bde2-b83f4fd7b059\" alt=\"Torrehub\" style=\"height:28px;width:auto\">\n        <div style=\"flex:1\"><\u002Fdiv>\n        <button style=\"font-family:inherit;font-size:14px;font-weight:700;color:#17203A;background:#FF8C00;border:none;border-radius:100px;padding:12px 19px;cursor:pointer\">Post a listing<\u002Fbutton>\n      <\u002Fdiv>\n\n      <div style=\"padding:32px 28px;display:grid;gap:16px;border-bottom:1px solid #E2E2EC\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">T-01 · About<\u002Fdiv>\n        <div style=\"background:#0056B3;border-radius:24px;padding:40px;display:grid;gap:20px;color:#FFFFFF\">\n          <h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;letter-spacing:-0.04em;line-height:1.04;max-width:760px\">One place for everything happening on the Costa Blanca<\u002Fh1>\n          <p style=\"margin:0;font-size:17px;line-height:1.6;color:#F1F7FD;max-width:640px\">Torrehub exists because finding a plumber, a flat or a Friday night here meant scrolling four Facebook groups and hoping. We put the whole coast in one searchable place.<\u002Fp>\n          <div style=\"display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;max-width:700px;padding-top:6px\">\n            <div style=\"background:#FFFFFF;border-radius:16px;padding:16px;display:grid;gap:3px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.03em\">152<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Categories<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:16px;padding:16px;display:grid;gap:3px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.03em\">35<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Towns<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:16px;padding:16px;display:grid;gap:3px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.03em\">318<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Verified<\u002Fspan><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:16px;padding:16px;display:grid;gap:3px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:26px;font-weight:700;letter-spacing:-0.03em\">8<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Languages<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px;align-items:start\">\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:26px;display:grid;gap:14px\">\n            <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:600;letter-spacing:-0.025em\">Why we built it<\u002Fh2>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.72;color:#3A4562\">The Costa Blanca has a permanent population, a large expat community and millions of visitors a year — and almost no shared infrastructure connecting them. Local businesses advertise on paper. Landlords post in groups that vanish from search.<\u002Fp>\n            <p style=\"margin:0;font-size:15.5px;line-height:1.72;color:#3A4562\">Torrehub brings ten categories into one index, all tied to one of 35 towns so a search means something geographically. Every seller account is checked by a person, and sellers can submit their NIE or NIF to earn a verified badge. No commission, no subscription — five free listings every 30 days.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:300px;border-radius:20px;overflow:hidden\"><image-slot id=\"c-about-img\" shape=\"rect\" placeholder=\"Costa Blanca street · 1200×760\"><\u002Fimage-slot><\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:32px 28px;display:grid;gap:16px;border-bottom:1px solid #E2E2EC\">\n        <div style=\"display:grid;gap:6px\">\n          <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">T-02 · Contact<\u002Fdiv>\n          <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;letter-spacing:-0.035em\">Get in touch<\u002Fh2>\n        <\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:14px;align-items:start\">\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:24px;display:grid;gap:14px\">\n            <div style=\"display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:14px\">\n              <label style=\"display:grid;gap:7px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5F6A8A\">Your name<\u002Fspan><input value=\"\" placeholder=\"Full name\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:15px;padding:14px 16px;border:1px solid #DCDCE8;border-radius:12px;background:#F7F7FB\"><\u002Flabel>\n              <label style=\"display:grid;gap:7px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5F6A8A\">Email address<\u002Fspan><input value=\"marco@\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:15px;padding:14px 16px;border:1.5px solid #C0304A;border-radius:12px;background:#FFFDFD\"><span style=\"font-size:12.5px;color:#C0304A\">Enter a complete email address<\u002Fspan><\u002Flabel>\n            <\u002Fdiv>\n            <label style=\"display:grid;gap:7px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5F6A8A\">Subject<\u002Fspan><div style=\"position:relative\"><div style=\"font-size:15px;padding:14px 44px 14px 16px;border:1px solid #DCDCE8;border-radius:12px;background:#F7F7FB\">Report a listing<\u002Fdiv><svg width=\"15\" height=\"15\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.2\" stroke-linecap=\"round\" style=\"position:absolute;right:16px;top:16px\"><path d=\"M6 9.5l6 6 6-6\"><\u002Fpath><\u002Fsvg><\u002Fdiv><\u002Flabel>\n            <label style=\"display:grid;gap:7px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;color:#5F6A8A\">Message<\u002Fspan><textarea placeholder=\"Tell us what's happening…\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:15px;padding:14px 16px;border:1px solid #DCDCE8;border-radius:16px;background:#F7F7FB;min-height:130px;resize:none\"><\u002Ftextarea><span style=\"font-size:12.5px;color:#5F6A8A\">0 / 2000 characters<\u002Fspan><\u002Flabel>\n            <div style=\"display:flex;align-items:center;gap:16px\">\n              <button style=\"font-family:inherit;font-size:15px;font-weight:700;color:#17203A;background:#FF8C00;border:none;border-radius:100px;padding:15px 26px;cursor:pointer\">Send message<\u002Fbutton>\n              <span style=\"font-size:13px;color:#5F6A8A\">We never share your address.<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#E4F4EE;border-radius:16px;padding:14px 16px;display:flex;gap:11px;align-items:flex-start\">\n              <svg width=\"18\" height=\"18\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0E7A5F\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M4 12.5l5 5L20 6.5\"><\u002Fpath><\u002Fsvg>\n              <div style=\"display:grid;gap:3px\"><span style=\"font-size:14px;font-weight:700;color:#0B5F49\">Message sent<\u002Fspan><span style=\"font-size:13px;line-height:1.5;color:#0B5F49\">We've got it and will reply within one working day.<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:12px\">\n            <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:20px;display:grid;gap:10px\">\n              <div style=\"background:#E6EFFA;border-radius:16px;padding:14px;display:grid;gap:3px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#2F5C8F\">Email<\u002Fspan><span style=\"font-size:14.5px;font-weight:700;color:#00458F\">hello@torrehub.es<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#F7F7FB;border-radius:16px;padding:14px;display:grid;gap:3px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5F6A8A\">Office<\u002Fspan><span style=\"font-size:14px;line-height:1.5\">Calle Ramón Gallud 12, 2º<br>03181 Torrevieja, Alicante<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#F7F7FB;border-radius:16px;padding:14px;display:grid;gap:3px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#5F6A8A\">Hours<\u002Fspan><span style=\"font-size:14px\">Monday – Friday, 09:00 – 17:00<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"position:relative;height:200px;border-radius:20px;overflow:hidden\"><image-slot id=\"c-contact-map\" shape=\"rect\" placeholder=\"Map · office\"><\u002Fimage-slot><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:32px 28px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;border-bottom:1px solid #E2E2EC\">\n        <div style=\"display:grid;gap:14px\">\n          <div style=\"display:grid;gap:6px\">\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">T-03 · FAQ<\u002Fdiv>\n            <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;letter-spacing:-0.03em\">How Torrehub works<\u002Fh2>\n          <\u002Fdiv>\n          <div style=\"position:relative\">\n            <input value=\"\" placeholder=\"Search the FAQ\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:15px;padding:14px 16px 14px 46px;border:1px solid #DCDCE8;border-radius:100px;background:#FFFFFF\">\n            <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"position:absolute;left:18px;top:15px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M16.5 16.5L21 21\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:grid;gap:8px\">\n            <div style=\"background:#E6EFFA;border-radius:20px;padding:18px;display:grid;gap:9px\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:16px\">\n                <span style=\"font-size:15px;font-weight:700;line-height:1.35;color:#00458F\">What's the difference between a Member, a Private Seller and a Business Seller?<\u002Fspan>\n                <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0056B3\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0;margin-top:2px\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg>\n              <\u002Fdiv>\n              <div style=\"font-size:14px;line-height:1.65;color:#2F5C8F\">A Member browses, saves, chats and reviews but cannot post listings. A Private Seller does everything a Member does plus posts listings as an individual, registering with a NIE. A Business Seller is the same for companies, with a NIF.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:14.5px;font-weight:600\">Why does my account need approval?<\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:14.5px;font-weight:600\">How many listings can I post, and what does it cost?<\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:14.5px;font-weight:600\">How long does a listing stay live?<\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:14.5px;font-weight:600\">What are the photo limits and formats?<\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:16px\"><span style=\"font-size:14.5px;font-weight:600\">What is the verified seller badge?<\u002Fspan><svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.4\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:grid;gap:14px\">\n          <div style=\"display:grid;gap:6px\">\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">T-04 / T-05 · Legal<\u002Fdiv>\n            <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:24px;font-weight:600;letter-spacing:-0.03em\">Privacy Policy<\u002Fh2>\n            <p style=\"margin:0;font-size:13px;color:#5F6A8A\">Last updated 12 August 2026 · Terms uses this identical layout<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"display:grid;grid-template-columns:160px minmax(0,1fr);gap:18px;align-items:start\">\n            <div style=\"display:grid;gap:3px;position:sticky;top:16px\">\n              <span style=\"font-size:12.5px;font-weight:700;color:#00458F;padding:9px 13px;border-radius:100px;background:#E6EFFA\">1. Who we are<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">2. What we collect<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">3. Why we collect it<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">4. NIE / NIF documents<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">5. Cookies<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">6. Who we share with<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">7. Your rights<\u002Fspan>\n              <span style=\"font-size:12.5px;color:#5F6A8A;padding:9px 13px\">8. Contact<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"display:grid;gap:16px\">\n              <div style=\"display:grid;gap:7px\">\n                <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-0.02em\">1. Who we are<\u002Fh3>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#3A4562\">Torrehub is a local directory and classifieds platform operating on the Costa Blanca, Spain. This policy explains what personal data we collect, why, and what rights you have under the GDPR and Spanish data protection law.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:grid;gap:7px\">\n                <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-0.02em\">2. What we collect<\u002Fh3>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#3A4562\">When you register we collect your name, username, email address and — for seller accounts — your NIE or NIF number. When you post a listing we store its contents, including photographs, contact details and location.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:18px;display:grid;gap:7px\">\n                <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;letter-spacing:-0.02em\">4. NIE and NIF documents<\u002Fh3>\n                <p style=\"margin:0;font-size:14.5px;line-height:1.7;color:#3A4562\">Verification documents are stored encrypted, visible only to reviewing administrators, and never displayed on your public profile or listings. Your NIE or NIF number itself is never shown publicly — only the verified badge is.<\u002Fp>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"padding:32px 28px;display:grid;gap:14px\">\n        <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#5F6A8A\">T-06 404 · T-07 401 · T-08 403<\u002Fdiv>\n        <div style=\"display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px\">\n          <div style=\"background:#EDEDF4;border-radius:20px;padding:26px;display:grid;gap:14px;align-content:start\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:56px;font-weight:700;line-height:0.9;letter-spacing:-0.05em;color:#C4C7D8\">404<\u002Fdiv>\n            <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em;line-height:1.15\">This page has moved on<\u002Fh3>\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:#5F6A8A\">The listing may have expired, or the address has a typo. There are 1,240 live listings — try a search.<\u002Fp>\n            <div style=\"position:relative\">\n              <input value=\"\" placeholder=\"Search Torrehub\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:14.5px;padding:14px 16p hat actually happens<\u002Fh2>\n              <p style=\"margin:0;font-size:13.5px;line-height:1.55;color:#F1F7FD\">The forms, the fee, the queue and the three documents people forget.<\u002Fp>\n              <span style=\"font-size:12px;color:#EDF4FC\">Elena Marín · 24 Aug · 7 min<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:8px;display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px\">\n            <div style=\"position:relative;height:100px;border-radius:14px;overflow:hidden\"><image-slot id=\"c-mblog-1\" shape=\"rect\" placeholder=\"\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding:4px 4px 4px 0;display:grid;gap:5px;align-content:center\">\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:100px;background:#E6EFFA;color:#00458F;justify-self:start\">Towns<\u002Fspan>\n              <h3 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:15px;font-weight:600;letter-spacing:-0.02em;line-height:1.25\">Where to live in Torrevieja if you work from home<\u002Fh3>\n              <span style=\"font-size:11.5px;color:#5F6A8A\">18 Aug · 6 min<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:8px;display:grid;grid-template-columns:104px minmax(0,1fr);gap:12px\">\n            <div style=\"position:relative;height:100px;border-radius:14px;overflow:hidden\"><image-slot id=\"c-mblog-2\" shape=\"rect\" placeholder=\"\"><\u002Fimage-slot><\u002Fdiv>\n            <div style=\"padding:4px 4px 4px 0;display:grid;gap:5px;align-content:center\">\n              <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:4px 10px;border-radius:100px;background:#FCEEE7;color:#9C4529;justify-self:start\">Moving 1.7;color:#3A4562\">Three documents cover almost every case: the EX-15 form, your passport with a photocopy, and the paid Modelo 790 receipt.<\u002Fp>\n          <div style=\"background:#FFF1E0;border-radius:16px;padding:16px\">\n            <p style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:600;line-height:1.45;letter-spacing:-0.02em;color:#8A5309\">The photocopy is the one people forget. There is no copier in the building.<\u002Fp>\n          <\u002Fdiv>\n          <div style=\"background:#E6EFFA;border-radius:16px;padding:16px;display:grid;gap:9px\">\n            <span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#2F5C8F\">Mentioned in this guide<\u002Fspan>\n            <div style=\"background:#FFFFFF;border-radius:100px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span style=\"font-size:13.5px;font-weight:700;color:#00458F\">Gestoría advisors<\u002Fspan>\n              <span style=\"font-size:12px;font-weight:700;color:#0056B3\">12 →<\u002Fspan>\n            <\u002Fdiv>\n            <div style=\"background:#FFFFFF;border-radius:100px;padding:11px 16px;display:flex;align-items:center;justify-content:space-between;gap:10px\">\n              <span style=\"font-size:13.5px;font-weight:700;color:#00458F\">Public Information<\u002Fspan>\n              <span style=\"font-size:12px;font-weight:700;color:#0056B3\">7 →<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <div style=\"width:390px;background:#F7F7FB;border-radius:28px;overflow:hidden;border:1px solid #17203A\">\n        <div style=\"padding:13px 18px;background:#EDEDF4;border-bottom:1px solid #E2E2EC;font-size:11.5px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:#5F6A8A\">T-01 · T-02 · T-03 · T-06 — mobile<\u002Fdiv>\n        <div style=\"padding:16px 14px;display:grid;gap:14px\">\n          <div style=\"background:#0056B3;border-radius:20px;padding:22px;display:grid;gap:14px;color:#FFFFFF\">\n            <div style=\"font-size:11.5px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;color:#FFD09A\">About<\u002Fdiv>\n            <h1 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:25px;font-weight:700;letter-spacing:-0.035em;line-height:1.1\">One place for everything on the Costa Blanca<\u002Fh1>\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:#F1F7FD\">Finding a plumber, a flat or a Friday night meant scrolling four Facebook groups. We put the whole coast in one searchable place.<\u002Fp>\n            <div style=\"display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px\">\n              <div style=\"background:#FFFFFF;border-radius:14px;padding:13px;display:grid;gap:2px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em\">152<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Categories<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FFFFFF;border-radius:14px;padding:13px;display:grid;gap:2px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em\">35<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Towns<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FFFFFF;border-radius:14px;padding:13px;display:grid;gap:2px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em\">318<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Verified<\u002Fspan><\u002Fdiv>\n              <div style=\"background:#FFFFFF;border-radius:14px;padding:13px;display:grid;gap:2px;color:#17203A\"><span style=\"font-family:'Space Grotesk',sans-serif;font-size:22px;font-weight:700;letter-spacing:-0.03em\">8<\u002Fspan><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;color:#17203A\">Languages<\u002Fspan><\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"position:relative;height:170px;border-radius:20px;overflow:hidden\"><image-slot id=\"c-mabout-img\" shape=\"rect\" placeholder=\"Street\"><\u002Fimage-slot><\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:18px;display:grid;gap:12px\">\n            <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;letter-spacing:-0.025em\">Get in touch<\u002Fh2>\n            <input value=\"\" placeholder=\"Your name\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:16px;padding:14px 18px;border:none;border-radius:100px;background:#F7F7FB\">\n            <input value=\"\" placeholder=\"Email address\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:16px;padding:14px 18px;border:none;border-radius:100px;background:#F7F7FB\">\n            <textarea placeholder=\"Tell us what's happening…\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:16px;padding:14px 18px;border:none;border-radius:16px;background:#F7F7FB;min-height:100px;resize:none\"><\u002Ftextarea>\n            <button style=\"font-family:inherit;font-size:15px;font-weight:700;color:#17203A;background:#FF8C00;border:none;border-radius:100px;height:50px;cursor:pointer;min-width:44px;box-sizing:border-box\">Send message<\u002Fbutton>\n            <div style=\"background:#E6EFFA;border-radius:16px;padding:14px;display:grid;gap:3px\"><span style=\"font-size:11.5px;font-weight:700;letter-spacing:0.08em;text-transform:uppercase;color:#2F5C8F\">Email<\u002Fspan><span style=\"font-size:14px;font-weight:700;color:#00458F\">hello@torrehub.es<\u002Fspan><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#FFFFFF;border:1px solid #E2E2EC;border-radius:20px;padding:18px;display:grid;gap:11px\">\n            <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:600;letter-spacing:-0.025em\">FAQ<\u002Fh2>\n            <div style=\"background:#E6EFFA;border-radius:16px;padding:15px;display:grid;gap:8px\">\n              <div style=\"display:flex;align-items:flex-start;justify-content:space-between;gap:12px\"><span style=\"font-size:14px;font-weight:700;line-height:1.35;color:#00458F\">What's the difference between the three account types?<\u002Fspan><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#0056B3\" stroke-width=\"2.6\" stroke-linecap=\"round\" style=\"flex-shrink:0;margin-top:2px\"><path d=\"M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n              <div style=\"font-size:13.5px;line-height:1.6;color:#2F5C8F\">A Member browses, saves and chats. A Private Seller adds listings with a NIE. A Business Seller is the same for companies, with a NIF.<\u002Fdiv>\n            <\u002Fdiv>\n            <div style=\"background:#F7F7FB;border-radius:16px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"font-size:14px;font-weight:600;line-height:1.35\">Why does my account need approval?<\u002Fspan><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.6\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n            <div style=\"background:#F7F7FB;border-radius:16px;padding:14px 15px;display:flex;align-items:center;justify-content:space-between;gap:12px\"><span style=\"font-size:14px;font-weight:600;line-height:1.35\">How many listings can I post?<\u002Fspan><svg width=\"16\" height=\"16\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2.6\" stroke-linecap=\"round\" style=\"flex-shrink:0\"><path d=\"M12 5v14M5 12h14\"><\u002Fpath><\u002Fsvg><\u002Fdiv>\n          <\u002Fdiv>\n          <div style=\"background:#EDEDF4;border-radius:20px;padding:20px;display:grid;gap:12px\">\n            <div style=\"font-family:'Space Grotesk',sans-serif;font-size:44px;font-weight:700;line-height:0.9;letter-spacing:-0.05em;color:#C4C7D8\">404<\u002Fdiv>\n            <h2 style=\"margin:0;font-family:'Space Grotesk',sans-serif;font-size:20px;font-weight:700;letter-spacing:-0.03em\">This page has moved on<\u002Fh2>\n            <p style=\"margin:0;font-size:14px;line-height:1.6;color:#5F6A8A\">Try a search — 1,240 live listings across the coast.<\u002Fp>\n            <div style=\"position:relative\">\n              <input value=\"\" placeholder=\"Search Torrehub\" style=\"box-sizing:border-box;width:100%;min-width:0;font-family:inherit;font-size:15px;padding:14px 16px 14px 44px;border:none;border-radius:100px;background:#FFFFFF\">\n              <svg width=\"17\" height=\"17\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"#5F6A8A\" stroke-width=\"2\" stroke-linecap=\"round\" style=\"position:absolute;left:17px;top:15px\"><circle cx=\"11\" cy=\"11\" r=\"7\"><\u002Fcircle><path d=\"M16.5 16.5L21 21\"><\u002Fpath><\u002Fsvg>\n            <\u002Fdiv>\n            <button style=\"font-family:inherit;font-size:15px;font-weight:700;color:#FFFFFF;background:#17203A;border:none;border-radius:100px;height:48px;cursor:pointer;min-width:44px;box-sizing:border-box\">Back to homepage<\u002Fbutton>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fdiv>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1920}}\"><\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
